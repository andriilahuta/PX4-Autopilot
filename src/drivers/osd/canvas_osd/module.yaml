module_name: CANVAS OSD
serial_config:
    - command: canvas_osd start -d ${SERIAL_DEV}
      port_config_param:
        name: COSD_CFG
        group: OSD

parameters:
    - group: OSD
      definitions:

        COSD_BATT_THRESH:
            description:
                short: Critical battery voltage threshold for OSD warnings (in percents)
            type: int32
            unit: '%'
            min: 0
            max: 100
            increment: 5
            default: 25
